[package]
name = "soroban-scan"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["soroban-scan contributors"]
license = "MIT"
repository = "https://github.com/alexandrbeher89-del/soroban-scan"
homepage = "https://github.com/alexandrbeher89-del/soroban-scan"
description = "Static analyzer for Soroban (Stellar) smart contracts written in Rust. Detects common security bug classes observed in real audits."
readme = "README.md"
keywords = ["soroban", "stellar", "audit", "security", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "soroban-scan"
path = "src/main.rs"

[lib]
name = "soroban_scan"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
